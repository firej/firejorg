name: Deploy to firej.org

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firej-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Hugo
        run: |
          HUGO_VERSION=0.167.0
          curl --fail --location --retry 3 -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo

      - name: Build site
        run: |
          hugo --minify
          test -s public/index.html

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo '::error::SSH_PRIVATE_KEY is missing'; exit 1; }
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          cp deploy/ssh_known_hosts ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'SSH'
          Host firej.org
            User firej
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ConnectionAttempts 3
          SSH
          if ! ssh firej.org 'test -d /opt/www/firejorg/public && test -w /opt/www/firejorg/public' 2> /tmp/deploy-ssh-error; then
            while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done < /tmp/deploy-ssh-error
            exit 1
          fi

      - name: Deploy to server
        run: |
          rsync -az --delay-updates --delete-delay \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            public/ firej.org:/opt/www/firejorg/public/

      - name: Verify files served by nginx
        run: |
          expected=$(sha256sum public/index.html | cut -d ' ' -f 1)
          actual=$(ssh firej.org 'cd /opt/traefik && sudo -n docker compose exec -T nginx wget -q -O - http://127.0.0.1/' | sha256sum | cut -d ' ' -f 1)
          test "$expected" = "$actual" || { echo '::error::nginx is not serving the deployed index.html'; exit 1; }

      - name: Verify public HTTPS
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            https://firej.org/ -o /tmp/live-index.html
          cmp public/index.html /tmp/live-index.html

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
